[package]
name = "ano-mp"
version = "0.1.0"
description = "ano-mp music player"
authors = ["Mark Wagner"]
edition = "2021"
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name
# (see https://github.com/rust-lang/cargo/issues/8519).
name = "ano_mp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# CI denies every warning (`cargo clippy --all-targets -- -D warnings` in
# scripts/check-all.py), so these fail the check (PLAN.md H8). Each unsafe
# block says why it is sound, and an unsafe fn's body still marks its
# unsafe operations.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
# Most are SQL rows read as tuples and destructured where they're read;
# naming each tuple type would only move it away from its query.
type_complexity = "allow"

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }
cmake = "0.1"

[dependencies]
# Tauri and its plugins are pinned exactly, in step with their npm packages
# in package.json: the build refuses to run when the two sides differ in
# major.minor. Move each pair together (PLAN.md H7).
# tray-icon: the optional menu-bar controls (PLAN.md F7).
tauri = { version = "=2.12.0", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Logging (PLAN.md H9): the facade, written to a rotating file in the
# app's log directory by tauri-plugin-log.
log = "0.4"
tauri-plugin-log = "=2.10.0"
tauri-plugin-dialog = "=2.7.3"
# Opens web links (a biography's Wikipedia article) in the browser.
tauri-plugin-opener = "=2.5.5"
# Track-change notifications, opt-in (PLAN.md F21). What
# tauri-plugin-notification uses on desktop, used directly because the
# plugin leaves out a notification's image there, and the cover is the
# point.
notify-rust = "4"
# Bundled so every platform (including iOS) gets the same SQLite.
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
walkdir = "2.5"
# Unicode folding for library sort keys; already in the dependency tree via
# Tauri's `url`, so they add no new code.
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_properties = "2.3"
# HTTP for the metadata services (PLAN.md Phase 4): blocking, since the work
# runs on its own thread at about a request a second. rustls with ring and
# the OS trust store, so TLS is the same on every platform, iOS included.
ureq = { version = "3.4", default-features = false, features = ["rustls", "gzip", "platform-verifier"] }
# SHA-256 for the image cache's file names, which must not change between
# builds; already linked in through rustls, so it adds no new code.
ring = "0.17"
# Comparing versions for the update check (updates.rs); already in the
# dependency tree through Tauri, so it adds no new code.
semver = "1"
# Embedded pictures as data: URLs in Get Info (PLAN.md F16); already in the
# dependency tree through Tauri.
base64 = "0.22"
# Watching library folders while the app runs (PLAN.md F9): FSEvents on
# macOS, inotify and ReadDirectoryChangesW in Phases 9 and 10.
notify = "8"
# Background threads at a low priority (library rescans, PLAN.md F9).
libc = "0.2"
# Cover thumbnails (PLAN.md H17): decodes JPEG, PNG and WebP, scales and
# writes JPEG, the same on every platform. Default features off: only those
# three formats (the owner's choice over ImageIO in the core).
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }

# Keys for metadata sources (a Discogs token) go in the OS keychain
# (metadata/keys.rs). macOS only for now: iOS needs the protected store
# (`protected` feature, a provisioning profile), Linux and Windows their
# own stores, each in its phase. security-framework is already linked in
# through rustls-platform-verifier.
[target.'cfg(target_os = "macos")'.dependencies]
keyring-core = "1.0"
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }

[dev-dependencies]
tempfile = "3"
# TypeScript types for the settings (settings::bindings), checked by a test
# against app/src/lib/generated/settings.ts; test-only, so not in the app.
ts-rs = { version = "12", default-features = false, features = ["serde-compat"] }
# Reads the commands' signatures for their generated TypeScript wrappers
# (bindings.rs, app/src/lib/generated/commands.ts; PLAN.md H15). Test-only;
# the same version Tauri's and serde's macros already build.
syn = { version = "=2.0.119", default-features = false, features = ["full", "parsing", "printing", "clone-impls"] }

[features]
# `--self-test`: a check of the sandboxed bundle that CI runs (PLAN.md H14,
# scripts/self-test-bundle.py). Never in a release build.
self-test = []

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

