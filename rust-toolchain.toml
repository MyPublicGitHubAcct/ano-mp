# The Rust toolchain for app/src-tauri, here and in CI (PLAN.md §3, H8).
# Move it with §9.1's toolchain updates, then fix any new clippy warnings.
[toolchain]
channel = "1.98.1"
profile = "minimal"
components = ["clippy", "rustfmt"]
# Both macOS architectures, for the universal app (scripts/build-app.py).
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
